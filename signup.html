<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <title>AerialOps Sign Up</title>
    <meta name="description" content="Create your AerialOps account to access the dashboard and data portal.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#0A0E17', secondary: '#E8EDF5', accent: '#00AEEF', status: '#F59E0B', darkBg: '#080C14', lightBg: '#F4F6FB' },
                    fontFamily: { 'barlow-condensed': ['"Barlow Condensed"', 'sans-serif'], 'inter': ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body
    class="bg-lightBg text-primary dark:bg-darkBg dark:text-secondary min-h-screen pt-24 pb-10 sm:pt-24 sm:pb-10 flex justify-center items-start lg:items-center">

    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0">
        <div class="absolute inset-0 grid-overlay opacity-20"></div>
    </div>

    <div class="fixed top-4 right-4 sm:top-6 sm:right-6 z-20 flex items-center gap-3">
        <button onclick="toggleTheme()"
            class="theme-toggle w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-200 text-primary hover:bg-accent hover:text-white dark:bg-white/5 dark:border-white/10 dark:text-white transition-colors">
            <i class="fas fa-moon"></i>
        </button>
        <button onclick="toggleRTL()"
            class="rtl-toggle w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-200 text-primary hover:bg-accent hover:text-white dark:bg-white/5 dark:border-white/10 dark:text-white transition-colors">
            <i class="fas fa-right-left text-sm" aria-hidden="true"></i>
        </button>
    </div>

    <main class="w-full max-w-2xl mx-auto px-4 relative z-10">
        <div
            class="bg-white dark:bg-primary/80 backdrop-blur-3xl border border-gray-200 dark:border-white/5 rounded-[4rem] overflow-hidden shadow-[0_0_100px_rgba(0,174,239,0.1)] flex flex-col p-8 lg:p-16 animate-hero-reveal">

            <!-- LOGO -->
            <a href="index.html" class="flex items-center gap-2 mb-12 justify-center group">
                <div class="relative w-10 h-10 flex items-center justify-center">
                    <svg class="w-8 h-8 text-accent transition-colors" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <div
                        class="absolute inset-0 animate-propeller opacity-0 group-hover:opacity-40 pointer-events-none">
                        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1 h-3 bg-accent rounded-full"></div>
                        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1 h-3 bg-accent rounded-full"></div>
                    </div>
                </div>
                <span
                    class="font-barlow-condensed text-[1.75rem] sm:text-2xl font-bold tracking-tight uppercase text-primary dark:text-white">AerialOps</span>
            </a>

            <div class="mb-8 text-center">
                <h1
                    class="font-barlow-condensed text-4xl lg:text-5xl font-black uppercase mb-4 text-primary dark:text-white stagger-reveal">
                    Sign Up</h1>
                <p class="text-sm text-primary/70 dark:text-secondary/80">Create your account in a few steps.</p>
            </div>

            <form class="space-y-6 stagger-reveal">
                <div class="grid grid-cols-1 gap-6">
                    <div class="space-y-2">
                        <label
                            class="block text-[10px] font-black uppercase tracking-[0.3em] text-primary/60 dark:text-secondary/80 ml-1">Full
                            Name</label>
                        <input type="text" placeholder="Your full name"
                            class="w-full bg-secondary/70 dark:bg-white/10 border border-gray-200 dark:border-white/20 rounded-2xl px-6 py-4 text-primary dark:text-secondary placeholder:text-primary/40 dark:placeholder:text-secondary/70 outline-none focus:border-accent transition-all">
                    </div>
                    <div class="space-y-2">
                        <label
                            class="block text-[10px] font-black uppercase tracking-[0.3em] text-primary/60 dark:text-secondary/80 ml-1">Company</label>
                        <input type="text" placeholder="Company name"
                            class="w-full bg-secondary/70 dark:bg-white/10 border border-gray-200 dark:border-white/20 rounded-2xl px-6 py-4 text-primary dark:text-secondary placeholder:text-primary/40 dark:placeholder:text-secondary/70 outline-none focus:border-accent transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label
                        class="block text-[10px] font-black uppercase tracking-[0.3em] text-primary/60 dark:text-secondary/80 ml-1">Email</label>
                    <input type="email" placeholder="you@example.com"
                        class="w-full bg-secondary/70 dark:bg-white/10 border border-gray-200 dark:border-white/20 rounded-2xl px-6 py-4 text-primary dark:text-secondary placeholder:text-primary/40 dark:placeholder:text-secondary/70 outline-none focus:border-accent transition-all">
                </div>

                <div class="space-y-2">
                    <label
                        class="block text-[10px] font-black uppercase tracking-[0.3em] text-primary/60 dark:text-secondary/80 ml-1">Work
                        Type</label>
                    <select
                        class="w-full bg-secondary/70 dark:bg-white/10 border border-gray-200 dark:border-white/20 rounded-2xl px-6 py-4 text-primary dark:text-secondary outline-none focus:border-accent transition-all text-sm">
                        <option>Inspection</option>
                        <option>Site Management</option>
                        <option>Construction Support</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label
                        class="block text-[10px] font-black uppercase tracking-[0.3em] text-primary/60 dark:text-secondary/80 ml-1">About
                        Your Work</label>
                    <textarea rows="3" placeholder="Tell us what you use AerialOps for."
                        class="w-full bg-secondary/70 dark:bg-white/10 border border-gray-200 dark:border-white/20 rounded-2xl px-6 py-4 text-primary dark:text-secondary placeholder:text-primary/40 dark:placeholder:text-secondary/70 outline-none focus:border-accent transition-all"></textarea>
                </div>

                <label class="flex items-start gap-3 text-xs text-primary/70 dark:text-secondary/75">
                    <input type="checkbox"
                        class="mt-0.5 w-4 h-4 accent-accent border border-gray-300 dark:border-white/30 rounded">
                    <span>I agree to the <a href="#" class="text-accent hover:underline">Terms</a>
                        and <a href="#" class="text-accent hover:underline">Privacy Policy</a></span>
                </label>

                <button
                    class="w-full py-6 bg-accent text-white rounded-2xl font-black uppercase tracking-widest hover:scale-105 active:scale-95 transition-all shadow-xl shadow-accent/20">Sign
                    Up</button>

                <div class="grid grid-cols-1 gap-4">
                    <a href="#"
                        class="flex items-center justify-center gap-3 py-4 bg-secondary/70 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-2xl hover:bg-secondary dark:hover:bg-white/10 transition-all group">
                        <i
                            class="fab fa-apple text-primary dark:text-white text-lg group-hover:scale-110 transition-transform"></i>
                        <span class="text-sm font-bold text-primary dark:text-white">Continue with Apple</span>
                    </a>
                    <a href="#"
                        class="flex items-center justify-center gap-3 py-4 bg-secondary/70 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-2xl hover:bg-secondary dark:hover:bg-white/10 transition-all group">
                        <i class="fab fa-google text-[#EA4335] text-lg group-hover:scale-110 transition-transform"></i>
                        <span class="text-sm font-bold text-primary dark:text-white">Continue with Google</span>
                    </a>
                </div>

                <p
                    class="text-center text-[10px] text-primary/45 dark:text-secondary/70 uppercase font-black tracking-widest mt-8">
                    Already have an account? <a href="login.html"
                        class="text-accent hover:underline decoration-2">Login</a>
                </p>
            </form>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
</body>

</html>
